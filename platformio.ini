; ============================================================
;  AquaGuard Dam Control — PlatformIO Configuration
;  Target: ESP32 DevKit V1
;  Framework: Arduino + LittleFS
; ============================================================
[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform  = espressif32
board     = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

; LittleFS filesystem (2 MB spiffs partition)
board_build.filesystem = littlefs

; Core build flags
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192

; Library dependencies (pinned versions for reproducibility)
lib_deps =
  esphome/AsyncTCP-esphome @ ^2.1.4
  mathieucarbou/ESPAsyncWebServer @ ^3.3.12
  bblanchon/ArduinoJson @ ^7.2.0
  madhephaestus/ESP32Servo @ ^3.0.5

; Upload settings — uncomment and set your port
; upload_port = COM3
; upload_speed = 921600

; Extra scripts: gzip web assets before building LittleFS
; extra_scripts = pre:tools/gzip_assets.py

; Native unit test environment
[env:native]
platform = native
build_flags = -DNATIVE_UNIT_TEST -std=c++17 -Iinclude
test_framework = unity
build_src_filter = +<*.cpp> -<main.cpp> -<WebApi.cpp>
