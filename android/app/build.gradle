plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aquaguard.scada'
    compileSdk 34

    defaultConfig {
        applicationId "com.aquaguard.scada"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Zero heavy external dependencies — ultra fast & lightweight APK (<2 MB)
}
